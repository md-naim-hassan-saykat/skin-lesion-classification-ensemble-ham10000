# =============================================================================
# Project Configuration
# Generalizable Ensemble Deep Learning for Dermoscopic Skin-Lesion
# Classification: Internal Evaluation on HAM10000 and External Evaluation
# on ISIC 2019
#
# This file contains:
#   1. canonical class definitions;
#   2. reported evaluation settings;
#   3. ensemble membership;
#   4. audited evaluation settings for the seven archived checkpoints;
#   5. repository execution defaults; and
#   6. quick-start training settings.
#
# IMPORTANT:
# The quick-start training settings at the end of this file are for new
# training runs. They are not the configuration used to train the archived
# manuscript checkpoints, which is documented in docs/training_pipeline.md.
# =============================================================================

# -----------------------------------------------------------------------------
# Global reproducibility
# -----------------------------------------------------------------------------
seed: 42
num_classes: 7

# Canonical class ordering used for harmonized evaluation and ensembling.
canonical_classes:
  - akiec
  - bcc
  - bkl
  - df
  - mel
  - nv
  - vasc

# -----------------------------------------------------------------------------
# Reported evaluation protocol
# -----------------------------------------------------------------------------
evaluation:
  # Standardized retrospective HAM10000 evaluation cohort.
  cohort_size_ham10000: 2003

  # Bootstrap uncertainty analysis (Supplementary Table S1).
  # Each metric is bootstrapped separately with seed bootstrap_seed + k:
  # accuracy 42, weighted F1 43, macro ROC-AUC 44, micro ROC-AUC 45.
  # See scripts/revision_analysis/bootstrap_ci.py.
  bootstrap_resamples: 1000
  bootstrap_seed: 42

  # Maximum-confidence multiclass Expected Calibration Error with equal-width,
  # right-closed bins (lo, hi].
  ece_bins: 15

  # Reported HAM10000 discrimination metrics:
  # accuracy, weighted F1, macro ROC-AUC, micro ROC-AUC.
  ham10000_auc_averages:
    - macro
    - micro

  # Reported ISIC 2019 discrimination metrics:
  # accuracy, weighted F1, macro ROC-AUC, weighted ROC-AUC.
  isic2019_auc_averages:
    - macro
    - weighted

# -----------------------------------------------------------------------------
# Ensemble definition
# -----------------------------------------------------------------------------
ensemble:
  # Equal-weight arithmetic mean of class-probability vectors.
  method: probability_mean

  expected_models: 7

  models:
    - cnn
    - resnet50
    - densenet121
    - efficientnet_b3
    - convnext_tiny
    - mobilenet_v3_large
    - vit_b_16

# -----------------------------------------------------------------------------
# Archived checkpoints: audited evaluation settings
# -----------------------------------------------------------------------------
#
# Values extracted from the archived training code (manuscript Supplementary
# Table S6). They are the settings used for every reported result and are read
# by src/evaluate.py and scripts/eval_all.sh. The same values are defined in
# src/archived.py; tests/test_archived.py checks that the two agree.
#
# normalization:
#   imagenet -> mean [0.485, 0.456, 0.406], std [0.229, 0.224, 0.225]
#   half     -> mean [0.5, 0.5, 0.5],       std [0.5, 0.5, 0.5]
#
# output_permutation maps raw checkpoint outputs to the canonical order:
#
#   canonical_probs = raw_probs[:, output_permutation]
#
# ResNet-50 and ViT-B/16 were trained with class indices in the unsorted order
# in which diagnoses appear in HAM10000_metadata.csv
# (bkl, nv, df, mel, vasc, bcc, akiec). Scoring them without this permutation
# reproduces the near-chance ISIC 2019 values of the original submission.
#
archived_checkpoints:
  cnn:
    file: cnn_ham10000_best_model.pth
    loader: torchvision
    image_size: 224
    normalization: half
    output_permutation: [0, 1, 2, 3, 4, 5, 6]

  resnet50:
    file: resnet50_ham10000.pth
    loader: torchvision
    image_size: 224
    normalization: imagenet
    output_permutation: [6, 5, 0, 2, 3, 1, 4]

  densenet121:
    file: densenet121_ham10000.pth
    loader: torchvision
    image_size: 224
    normalization: half
    output_permutation: [0, 1, 2, 3, 4, 5, 6]

  efficientnet_b3:
    file: efficientnet_b3_best.pth
    loader: torchvision
    image_size: 300
    normalization: half
    output_permutation: [0, 1, 2, 3, 4, 5, 6]

  convnext_tiny:
    file: convnext_tiny_ham10000.pth
    loader: torchvision
    image_size: 224
    normalization: imagenet
    output_permutation: [0, 1, 2, 3, 4, 5, 6]

  mobilenet_v3_large:
    file: mobilenetv3_ham10000.pth
    loader: torchvision
    image_size: 224
    normalization: half
    output_permutation: [0, 1, 2, 3, 4, 5, 6]

  vit_b_16:
    # Hugging Face ViTForImageClassification state dict
    # (google/vit-base-patch16-224 backbone, 7-class head).
    file: vit_ham10000_best_model.pth
    loader: hf_vit
    image_size: 224
    normalization: half
    output_permutation: [6, 5, 0, 2, 3, 1, 4]

# -----------------------------------------------------------------------------
# Quick-start training image sizes
# -----------------------------------------------------------------------------
#
# Used by src/train.py for new training runs. Archived-checkpoint evaluation
# uses archived_checkpoints above instead.
#
preprocessing:
  cnn:
    image_size: 224

  resnet50:
    image_size: 224

  densenet121:
    image_size: 224

  efficientnet_b3:
    image_size: 300

  convnext_tiny:
    image_size: 224

  mobilenet_v3_large:
    image_size: 224

  vit_b_16:
    image_size: 224

# -----------------------------------------------------------------------------
# Data-loader defaults
# -----------------------------------------------------------------------------
data:
  # Expected ImageFolder structure:
  #
  # data/HAM10000/trainval/
  # ├── train/
  # │   ├── akiec/
  # │   ├── bcc/
  # │   ├── bkl/
  # │   ├── df/
  # │   ├── mel/
  # │   ├── nv/
  # │   └── vasc/
  # └── val/
  #     ├── akiec/
  #     ├── bcc/
  #     ├── bkl/
  #     ├── df/
  #     ├── mel/
  #     ├── nv/
  #     └── vasc/
  #
  root: data/HAM10000/trainval
  num_workers: 2

# -----------------------------------------------------------------------------
# Output directory
# -----------------------------------------------------------------------------
output:
  dir: outputs

# -----------------------------------------------------------------------------
# Quick-start training defaults
# -----------------------------------------------------------------------------
#
# These settings support new repository training runs.
#
# They are NOT the settings used to train the seven archived manuscript
# checkpoints. Those used unweighted cross-entropy, Adam with a constant
# learning rate (ConvNeXt-Tiny: AdamW with ReduceLROnPlateau and mixed
# precision), and early stopping on validation accuracy; ResNet-50 was a linear
# probe on a frozen backbone. See docs/training_pipeline.md.
#
# The quick-start src/train.py uses:
#   - class-weighted cross-entropy;
#   - AdamW optimizer;
#   - cosine-annealing learning-rate scheduling;
#   - weighted F1 for early stopping/model selection.
#
train:
  epochs: 50
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 7
  pretrained: true
