# =============================================================================
# Project Configuration
# Generalizable Ensemble Deep Learning for Dermoscopic Skin-Lesion
# Classification: Internal Evaluation on HAM10000 and External Evaluation
# on ISIC 2019
#
# This file contains:
#   1. canonical class definitions;
#   2. reported evaluation settings;
#   3. ensemble membership;
#   4. checkpoint-output compatibility metadata;
#   5. repository execution defaults; and
#   6. quick-start training settings.
#
# IMPORTANT:
# Repository execution defaults do not necessarily reproduce the exact
# historical training or preprocessing configuration of every archived
# manuscript checkpoint.
# =============================================================================

# -----------------------------------------------------------------------------
# Global reproducibility
# -----------------------------------------------------------------------------
seed: 42
num_classes: 7

# Canonical class ordering used for harmonized evaluation and ensembling.
canonical_classes:
  - akiec
  - bcc
  - bkl
  - df
  - mel
  - nv
  - vasc

# -----------------------------------------------------------------------------
# Reported evaluation protocol
# -----------------------------------------------------------------------------
evaluation:
  # Standardized retrospective HAM10000 evaluation cohort.
  cohort_size_ham10000: 2003

  # Bootstrap uncertainty analysis.
  bootstrap_resamples: 1000
  bootstrap_seed: 42

  # Maximum-confidence multiclass Expected Calibration Error.
  ece_bins: 15

  # Reported HAM10000 discrimination metrics:
  # accuracy, weighted F1, macro ROC-AUC, micro ROC-AUC.
  ham10000_auc_averages:
    - macro
    - micro

  # Reported ISIC 2019 discrimination metrics:
  # accuracy, weighted F1, macro ROC-AUC, weighted ROC-AUC.
  isic2019_auc_averages:
    - macro
    - weighted

# -----------------------------------------------------------------------------
# Ensemble definition
# -----------------------------------------------------------------------------
ensemble:
  # Equal-weight arithmetic mean of class-probability vectors.
  method: probability_mean

  expected_models: 7

  models:
    - cnn
    - resnet50
    - densenet121
    - efficientnet_b3
    - convnext_tiny
    - mobilenet_v3_large
    - vit_b_16

# -----------------------------------------------------------------------------
# Historical checkpoint output ordering
# -----------------------------------------------------------------------------
#
# Archived models may not all emit probabilities in the canonical class order.
#
# Each permutation is interpreted as:
#
#   canonical_probs = raw_probs[:, permutation]
#
# Canonical identity ordering:
#
#   [0, 1, 2, 3, 4, 5, 6]
#
# Historical permutations must be populated only from audited checkpoint or
# evaluation metadata. Unknown values must remain null rather than being
# inferred or guessed.
#
output_permutations:
  cnn: [0, 1, 2, 3, 4, 5, 6]
  densenet121: [0, 1, 2, 3, 4, 5, 6]
  efficientnet_b3: [0, 1, 2, 3, 4, 5, 6]
  convnext_tiny: [0, 1, 2, 3, 4, 5, 6]
  mobilenet_v3_large: [0, 1, 2, 3, 4, 5, 6]

  # REQUIRED for exact archived-checkpoint reproduction:
  # replace only when verified from historical audit metadata.
  resnet50: null
  vit_b_16: null

# -----------------------------------------------------------------------------
# Repository preprocessing defaults
# -----------------------------------------------------------------------------
#
# These values support current repository execution and quick-start workflows.
#
# They must not be interpreted as proof that every historical manuscript
# checkpoint used identical preprocessing. Exact reproduction of archived
# predictions requires the preprocessing associated with each checkpoint.
#
preprocessing:
  cnn:
    image_size: 224

  resnet50:
    image_size: 224

  densenet121:
    image_size: 224

  efficientnet_b3:
    image_size: 224

  convnext_tiny:
    image_size: 224

  mobilenet_v3_large:
    image_size: 224

  vit_b_16:
    image_size: 224

# -----------------------------------------------------------------------------
# Data-loader defaults
# -----------------------------------------------------------------------------
data:
  # Expected ImageFolder structure:
  #
  # data/HAM10000/trainval/
  # ├── train/
  # │   ├── akiec/
  # │   ├── bcc/
  # │   ├── bkl/
  # │   ├── df/
  # │   ├── mel/
  # │   ├── nv/
  # │   └── vasc/
  # └── val/
  #     ├── akiec/
  #     ├── bcc/
  #     ├── bkl/
  #     ├── df/
  #     ├── mel/
  #     ├── nv/
  #     └── vasc/
  #
  root: data/HAM10000/trainval
  num_workers: 2

# -----------------------------------------------------------------------------
# Output directory
# -----------------------------------------------------------------------------
output:
  dir: outputs

# -----------------------------------------------------------------------------
# Quick-start training defaults
# -----------------------------------------------------------------------------
#
# These settings support new repository training runs.
#
# They do NOT claim to reconstruct the seven historical archived manuscript
# training runs.
#
# Current src/train.py uses:
#   - weighted cross-entropy;
#   - AdamW optimizer;
#   - cosine-annealing learning-rate scheduling;
#   - weighted F1 for early stopping/model selection.
#
train:
  epochs: 50
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 7
  pretrained: true
