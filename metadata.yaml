# =============================================================================
# Project Metadata
# Generalizable Ensemble Deep Learning for Skin Lesion Classification
# Internal and External Validation on HAM10000 and ISIC 2019
# =============================================================================

title: "Generalizable Ensemble Deep Learning for Skin Lesion Classification: Internal and External Validation on HAM10000 and ISIC 2019"

description: >
  Reproducible deep learning framework for multiclass dermoscopic skin-lesion
  classification with internal validation on HAM10000 and external validation
  on ISIC 2019. The repository provides implementations and evaluation
  workflows for seven deep learning backbones spanning a conventional CNN,
  ResNet-50, DenseNet-121, EfficientNet-B3, ConvNeXt-Tiny,
  MobileNetV3-Large, and ViT-B/16, together with probability-level
  soft-voting ensemble inference. The framework includes standardized data
  preprocessing, training and evaluation pipelines, class-imbalance handling,
  model calibration, discrimination and classification metrics,
  interpretability analysis, and reproducibility artifacts for assessing
  generalization across internal and external dermoscopic datasets.

authors:
  - name: "Md Naim Hassan Saykat"
    affiliation: "Department of Computer Science, Université Paris-Saclay"
    email: "mdnaimhassansaykat@gmail.com"
    orcid: "https://orcid.org/0009-0007-5270-3970"

version: "1.0.0"
date-released: "2025-10-19"
license: "MIT"

repository:
  code: "https://github.com/md-naim-hassan-saykat/skin-lesion-classification-ensemble-ham10000"

archive:
  provider: "Zenodo"
  doi: "10.5281/zenodo.17390952"
  url: "https://doi.org/10.5281/zenodo.17390952"

software:
  language: "Python"
  python_version: "3.11"
  framework: "PyTorch"
  framework_version: "2.9.0"
  torchvision_version: "0.24.0"

datasets:
  - name: "HAM10000"
    role: "Internal development and validation dataset"
    modality: "Dermoscopic images"
    classes: 7
    url: "https://www.kaggle.com/datasets/kmader/skin-cancer-mnist-ham10000"

  - name: "ISIC 2019"
    role: "External validation dataset"
    modality: "Dermoscopic images"
    url: "https://challenge.isic-archive.com/data.html"

models:
  backbones:
    - "Conventional CNN"
    - "ResNet-50"
    - "DenseNet-121"
    - "EfficientNet-B3"
    - "ConvNeXt-Tiny"
    - "MobileNetV3-Large"
    - "ViT-B/16"

ensemble:
  method: "Probability-level soft voting"
  implementation: "src/ensemble.py"

evaluation:
  internal_dataset: "HAM10000"
  external_dataset: "ISIC 2019"
  metrics:
    - "Accuracy"
    - "Weighted F1-score"
    - "Macro ROC-AUC"
    - "Micro ROC-AUC"
    - "Expected Calibration Error (ECE)"

reproducibility:
  random_seed: 42
  batch_size: 32
  optimizer: "Adam"
  initial_learning_rate: 0.0001
  learning_rate_schedule: "Cosine annealing"
  maximum_epochs: 50
  loss: "Weighted cross-entropy"
  input_normalization: "ImageNet normalization"
  calibration: "Temperature scaling"
  interpretability: "Grad-CAM++"

keywords:
  - "deep learning"
  - "ensemble learning"
  - "skin lesion classification"
  - "dermoscopy"
  - "medical image analysis"
  - "external validation"
  - "model calibration"
  - "interpretability"
  - "convolutional neural networks"
  - "vision transformers"
  - "HAM10000"
  - "ISIC 2019"

citation:
  text: >
    Saykat, M. N. H. (2025). Generalizable Ensemble Deep Learning for Skin
    Lesion Classification: Internal and External Validation on HAM10000 and
    ISIC 2019. Zenodo. https://doi.org/10.5281/zenodo.17390952
  doi: "10.5281/zenodo.17390952"
