# ==============================================================
# .pre-commit-config.yaml
# Automated code-quality and repository-hygiene checks for the
# HAM10000 / ISIC 2019 skin-lesion classification project
# ==============================================================

# Jupyter notebooks are intentionally excluded from automated
# formatting and linting to avoid unnecessary notebook JSON changes.
exclude: '\.ipynb$'

repos:
  # ------------------------------------------------------------
  # Python formatter: Black
  # ------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args:
          - --line-length=100
        language_version: python3

  # ------------------------------------------------------------
  # Python linter: Ruff
  # Project-specific Ruff settings are defined in pyproject.toml.
  # ------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --config=pyproject.toml
        types_or:
          - python
          - pyi

  # ------------------------------------------------------------
  # General repository hygiene
  # ------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace from text files.
      - id: trailing-whitespace

      # Ensure text files end with a newline.
      - id: end-of-file-fixer

      # Validate structured configuration files.
      - id: check-yaml
      - id: check-json
      - id: check-toml

      # Validate Python syntax.
      - id: check-ast

      # Detect unresolved Git merge-conflict markers.
      - id: check-merge-conflict

      # Detect filenames that conflict on case-insensitive systems.
      - id: check-case-conflict

      # Normalize mixed line endings to LF.
      - id: mixed-line-ending
        args:
          - --fix=lf

      # Ensure executable scripts contain a valid shebang.
      - id: check-executables-have-shebangs

      # Prevent accidentally committing large files directly to Git.
      # Properly tracked Git LFS files are skipped automatically.
      - id: check-added-large-files
        args:
          - --maxkb=10240
