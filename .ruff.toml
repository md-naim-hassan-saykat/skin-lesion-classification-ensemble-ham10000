# Ruff configuration for Skin Lesion Ensemble Project
target-version = "py311"
line-length = 120

[lint]
# enable rule sets
select = ["E", "F", "I", "B", "C90"]
# ignore long lines (Black handles wrapping) and E203 (Black compat)
ignore = ["E501", "E203"]
# do not lint notebooks, venvs, artifacts
exclude = [
  ".venv", "env", "venv",
  "__pycache__", "build", "dist",
  "outputs", "data", "datasets",
  "notebooks", "notebooks/**"
]

[lint.isort]
combine-as-imports = true
known-first-party = ["src"]
lines-between-types = 1

[lint.per-file-ignores]
"__init__.py" = ["F401"]
