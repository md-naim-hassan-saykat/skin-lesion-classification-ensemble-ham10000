# Ruff configuration for Skin Lesion Ensemble Project

# Linting, formatting, and style consistency

line-length = 120
target-version = "py311"  # Python 3.11 is the project default

# --- Linting Rules ---
[lint]
# Enable core pycodestyle (E) and pyflakes (F) checks
extend-select = ["E", "F", "B", "I", "C90"]

# Ignore specific rules
ignore = [
  "E501",  # line too long (handled by Black)
  "E203",  # whitespace before ':', conflicts with Black
]

# Exclude generated, notebook, and cache directories
exclude = [
  ".venv",
  "env",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "outputs",
  "data",
  "datasets",
  "notebooks/*.ipynb",
  "notebooks/**/*.ipynb",
  "migrations",
]

# --- Import Sorting ---
[lint.isort]
combine-as-imports = true
known-first-party = ["src"]
lines-between-types = 1

# --- Per-file ignores (optional fine-tuning) ---
[per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in package init files
