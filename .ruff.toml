# Ruff configuration for Skin Lesion Ensemble Project
# ----------------------------------------------------
# Provides linting, import sorting, and style enforcement for Python 3.11.

line-length = 120
target-version = "py311"  # Python 3.11 is the project default

# ----------------------------------------------------
# Linting Rules
# ----------------------------------------------------
[lint]
# Enable core rule families: E (pycodestyle), F (pyflakes),
# B (bugbear), I (import conventions), and C90 (complexity checks)
extend-select = ["E", "F", "B", "I", "C90"]

# Ignore rules that conflict with Black or project preferences
ignore = [
  "E501",  # Line too long (handled by Black)
  "E203",  # Whitespace before ':', conflicts with Black
]

# Exclude generated files, environments, and notebooks
exclude = [
  ".venv",
  "env",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "outputs",
  "results",
  "data",
  "datasets",
  "logs",
  "notebooks",
  "migrations",
]

# ----------------------------------------------------
# Import Sorting
# ----------------------------------------------------
[lint.isort]
combine-as-imports = true
known-first-party = ["src"]
lines-between-types = 1
order-by-type = true

# ----------------------------------------------------
# Per-file Rule Exceptions
# ----------------------------------------------------
[per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in package __init__ files
