name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install PyTorch trio first to avoid resolver downgrades / conflicts
      - name: Install torch family
        run: |
          pip install "torch==2.9.0" "torchvision==0.24.0" "torchaudio==2.9.0"

      - name: Install project requirements
        run: |
          pip install -r requirements.txt --no-deps
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          else
            # ensure ruff/pytest are present even if the file is missing
            pip install ruff pytest
          fi

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -q
