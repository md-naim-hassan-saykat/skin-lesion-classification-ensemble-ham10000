name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Pin torch family first (prevents resolver from downgrading them)
      - name: Install torch family
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.9.0" "torchvision==0.24.0" "torchaudio==2.9.0"

      # Install the rest without touching torch deps
      - name: Install project requirements (no deps)
        run: |
          pip install -r requirements.txt --no-deps
          pip install -r requirements-ci.txt

      - name: Lint (ruff + black --check)
        run: |
          ruff check .
          black --check .

      - name: Run smoke tests only
        env:
          # Force CPU / headless friendly settings
          CUDA_VISIBLE_DEVICES: ""
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Run only smoke tests (they don't need the dataset)
          pytest -q -k "smoke" -m "not slow"
