name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # System deps often needed by opencv-python wheels
      - name: Install system libs (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      # Make repo importable as "src/..." (tests rely on this)
      - name: Export PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # Pin torch family first, then prevent resolver from changing them
      - name: Install torch family
        run: |
          pip install "torch==2.2.2" "torchvision==0.17.2" "torchaudio==2.2.2"

      - name: Install project requirements (no deps)
        run: |
          pip install -r requirements.txt --no-deps
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          else
            pip install ruff pytest pytest-cov
          fi

      - name: Show environment
        run: |
          python -V
          which python
          pip list | sed -n '1,120p'

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -q
