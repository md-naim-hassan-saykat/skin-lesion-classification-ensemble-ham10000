name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Make `import src...` work when running scripts in tests
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: System libs for OpenCV wheels
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Just install your pinned reqs; no need to pin torch separately
          pip install -r requirements.txt -r requirements-ci.txt
          # ensure pytest-timeout for addopts="--timeout=10"
          pip install pytest-timeout

      - name: Show environment
        run: |
          python -V
          pip list | sed -n '1,120p'

      - name: Lint (ruff)
        run: |
          ruff clean
          ruff check src scripts tests --fix

      - name: Run tests
        run: pytest -q
