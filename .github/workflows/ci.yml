name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v1-${{ hashFiles('requirements*.txt','pyproject.toml') }}

      - name: Install torch (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.0" "torchvision==0.24.0" "torchaudio==2.9.0"

      - name: Install project requirements (no deps)
        run: |
          grep -viE '^(torch|torchvision|torchaudio)\b' requirements.txt > req-no-torch.txt
          pip install -r req-no-torch.txt
          pip install -r requirements-ci.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Smoke tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q -k "smoke" -m "not slow"
