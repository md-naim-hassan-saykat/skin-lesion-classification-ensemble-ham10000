[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | data
  | outputs
  | results
  | build
  | dist
  | notebooks
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "data",
    "outputs",
    "results",
    "build",
    "dist",
    "__pycache__",
    "*.ipynb",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
