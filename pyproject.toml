[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "skin-lesion-ensemble"
version = "1.0.0"
description = "Generalizable Ensemble Deep Learning for Skin Lesion Classification: Internal and External Validation on HAM10000 and ISIC 2019"
authors = [
  { name = "Md Naim Hassan Saykat", email = "mdnaimhassansaykat@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["skin lesion", "ensemble learning", "deep learning", "medical imaging", "PyTorch"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
